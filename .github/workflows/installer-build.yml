name: Build UptimeWidget Installer

on:
    workflow_call:
        inputs:
            is_prerelease:
                description: "Whether this build is a pre-release (adds -nightly to the installer name)."
                required: true
                type: boolean

permissions:
    actions: read
    contents: write


jobs:
    build_installer:
        runs-on: windows-latest


        steps:
          - name: Checkout code
            uses: actions/checkout@v7
            with:
                sparse-checkout: |
                    UptimeWidgetInstaller
                sparse-checkout-cone-mode: true

          - name: Download build artifact
            uses: actions/download-artifact@v8
            with:
                name: UptimeWidget-build-artifact
                path: UptimeWidget-build

          - name: Show artifact files
            shell: pwsh
            run: |
                Get-ChildItem UptimeWidget-build -Recurse

          - name: dotnet version
            run: dotnet --version

          - name: Determine installer name
            id: installer_name
            shell: pwsh
            run: |
                $exe = Join-Path $PWD 'UptimeWidget-build\UptimeWidget.exe'
                $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion
                $suffix = if ("${{ inputs.is_prerelease }}" -eq "true") { "-nightly" } else { "" }
                $name = "UptimeWidget-$version$suffix-Setup"
                Write-Host "Installer name: $name"
                "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          - name: Compute runtime cache key stamp
            id: cache_stamp
            shell: pwsh
            run: |
                $stamp = (Get-Date).ToString('yyyy') + '-w' + [System.Globalization.ISOWeek]::GetWeekOfYear((Get-Date))
                Write-Host "Cache stamp: $stamp"
                "stamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          - name: Cache .NET Desktop Runtime payload
            uses: actions/cache@v6
            with:
                path: UptimeWidgetInstaller\UptimeWidgetBootstrapper\obj\windowsdesktop-runtime-win-x64.exe
                key: dotnet-desktop-runtime-win-x64-10.0-${{ steps.cache_stamp.outputs.stamp }}
                restore-keys: |
                    dotnet-desktop-runtime-win-x64-10.0-

          - name: Build installer
            shell: pwsh
            run: |
                $name = "${{ steps.installer_name.outputs.name }}"
                $payloadDir = Join-Path $PWD "UptimeWidget-build"
                $msiPath = Join-Path $PWD "UptimeWidgetInstaller\UptimeWidgetInstaller\bin\x64\Release\en-US\$name.msi"
                dotnet build UptimeWidgetInstaller\UptimeWidgetInstaller.slnx -c Release -p:PayloadDir="$payloadDir" -p:InstallerName="$name" -p:MsiPath="$msiPath"

          - name: Stage installer files
            shell: pwsh
            run: |
              $installerName = "${{ steps.installer_name.outputs.name }}"
              $exeSourceDir = Join-Path $PWD "UptimeWidgetInstaller\UptimeWidgetBootstrapper\bin\x64\Release"
              $msiSourceDir = Join-Path $PWD "UptimeWidgetInstaller\UptimeWidgetInstaller\bin\x64\Release\en-US"
              $destDir = Join-Path $PWD "UptimeWidget-build\Installer"
                
              New-Item -ItemType Directory -Path $destDir -Force | Out-Null
                
              $matchingExe = Get-ChildItem -Path $exeSourceDir -Filter "*.exe" |
                Where-Object { $_.Name -eq "$installerName.exe" } |
                Select-Object -First 1
                
              if (-not $matchingExe) {
                Write-Error "No installer executable found matching '$installerName.exe' in $exeSourceDir"
                exit 1
              }
                
              if (-not (Test-Path $msiSourceDir)) {
                  Write-Error "Source directory not found: $msiSourceDir"
                  exit 1
              }

              Copy-Item -Path (Join-Path $msiSourceDir '*') -Destination $destDir -Recurse -Force
                              
              Copy-Item -Path $matchingExe.FullName -Destination $destDir -Force
              Get-ChildItem $destDir -Recurse

          - name: Verify installer files
            shell: pwsh
            run: |
                Get-ChildItem UptimeWidget-build\Installer -Recurse

          - name: Publish installer artifacts
            uses: actions/upload-artifact@v7
            with: 
                name: UptimeWidget-installer-artifact
                path: |
                    UptimeWidget-build\Installer
