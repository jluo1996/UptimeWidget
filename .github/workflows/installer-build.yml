name: Build UptimeWidget Installer

on:
    workflow_run:
        workflows:
            - Build UptimeWidget
        types:
            - completed

permissions:
    actions: read
    contents: read


jobs:
    build_installer:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: windows-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v7
            with:
                sparse-checkout: |
                    UptimeWidgetInstaller
                    buildInstaller.bat
                sparse-checkout-cone-mode: true

          - name: Download build artifact
            uses: actions/download-artifact@v8
            with:
                name: UptimeWidget-build-artifact
                path: UptimeWidget-build
                github-token: ${{ secrets.GITHUB_TOKEN }}
                run-id: ${{ github.event.workflow_run.id }}

          - name: Show artifact files
            shell: pwsh
            run: |
                Get-ChildItem UptimeWidget-build -Recurse

          - name: dotnet version
            run: dotnet --version

          - name: Install WiX ClI
            run: dotnet tool install --global WiX
            
          - name: WiX version
            run: wix --version

          - name: Determine installer name
            id: installer_name
            shell: pwsh
            run: |
                $exe = Join-Path $PWD 'UptimeWidget-build\UptimeWidget.exe'
                $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion
                $name = "UptimeWidget $version"
                Write-Host "Installer name: $name"
                "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          - name: Build installer
            shell: cmd
            run: |
                call buildInstaller.bat Release "%CD%\UptimeWidget-build\" "${{ steps.installer_name.outputs.name }}"

          - name: Stage installer files
            shell: cmd
            run: |
                if not exist "%CD%\UptimeWidget-build\Installer" mkdir "%CD%\UptimeWidget-build\Installer"
                robocopy "%CD%\UptimeWidgetInstaller\UptimeWidgetBootstrapper\bin\Release" "%CD%\UptimeWidget-build\Installer" *.exe /XF windowsdesktop-runtime-win-x64.exe
                if %ERRORLEVEL% GEQ 8 exit /b 1
                exit /b 0

          - name: Verify installer files
            shell: pwsh
            run: |
                Get-ChildItem UptimeWidget-build\Installer -Recurse

          - name: Publish installer artifacts
            uses: actions/upload-artifact@v7
            with: 
                name: UptimeWidget-installer-artifact
                path: |
                    UptimeWidget-build\Installer

            