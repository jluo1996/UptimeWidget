name: Build UptimeWidget Installer

on:
  workflow_run:
    workflows:
      - Build UptimeWidget
    types:
      - completed

jobs:
  build_installer:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: UptimeWidget-build-artifact
          path: UptimeWidget-build

      - name: Show artifact files
        shell: pwsh
        run: |
          Get-ChildItem UptimeWidget-build -Recurse

      - name: dotnet version
        run: dotnet --version

      - name: Install WiX ClI
        run: dotnet tool install --global WiX
        
      - name: WiX version
        run: wix --version


