name: Build UptimeWidget

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-lastest

    env:
      Configuration: Release
      Platform: x64
      Solution: UptimeWidget/UptimeWidget.slnx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '18.0'

      - name: Restore
        run: msbuild ${{ env.Solution }} /t:Restore /p:Configuration=${{ env.Configuration }} /p:Platform=${{ env.Platform }}

      - name: Build
        run: msbuild ${{ env.Solution }} /p:Configuration=${{ env.Configuration }} /p:Platform=${{ env.Platform }} /restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: false
        with:
          name: UptimeWidget
          path: UptimeWidget/UptimeWidget/bin/${{ env.Platform }}/${{ env.Configuration }}/net10.0-windows/
          if-no-files-found: error
