name: Build UptimeWidget

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            version:
                description: "Version to build (e.g. 1.2.3). Defaults to 1.0.<run_number>."
                required: false
                type: string

env:
    CONFIGURATION: Release
    PLATFORM: x64
    UptimeWidget_SOLUTION: UptimeWidget/UptimeWidget.slnx
    MAJOR_VERSION: 1

jobs:
    build_UptimeWidget:
        runs-on: windows-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v7
            with:
                sparse-checkout: |
                    UptimeWidget
                sparse-checkout-cone-mode: true

          - name: dotnet version
            run: dotnet --version

          - name: Resolve version
            id: version
            shell: pwsh
            run: |
                $v = "${{ github.event.inputs.version }}"
                if ([string]::IsNullOrWhiteSpace($v)) { $v = "${{ env.MAJOR_VERSION }}.0.${{ github.run_number }}" }
                Write-Output "value=$v" >> $env:GITHUB_OUTPUT
                Write-Output "Building version $v"

          - name: Build UptimeWidget
            run: |
                dotnet build "$env:UptimeWidget_SOLUTION" --configuration "$env:CONFIGURATION" -p:Version=${{ steps.version.outputs.value }}

          - name: Verify publish files
            shell: pwsh
            run: |
                Get-ChildItem `
                    UptimeWidget/UptimeWidget/bin/${{ env.PLATFORM }}/${{ env.CONFIGURATION }}/net10.0-windows/ `
                    -Recurse

          - name: Publish artifacts
            uses: actions/upload-artifact@v7
            with:
                name: UptimeWidget-build-artifact
                path: |
                    UptimeWidget/UptimeWidget/bin/${{ env.PLATFORM }}/${{ env.CONFIGURATION }}/net10.0-windows/
                    !UptimeWidget/UptimeWidget/bin/${{ env.PLATFORM }}/${{ env.CONFIGURATION }}/net10.0-windows/**/*.pdb
