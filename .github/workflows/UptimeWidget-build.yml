name: Build UptimeWidget

on:
    push:
        branches:
            - "**"
    workflow_dispatch:
        inputs:
            build_installer:
                description: "Also build the installer (auto-enabled for main/release/**)."
                required: false
                type: boolean
                default: false

permissions:
    actions: read
    contents: write

env:
    CONFIGURATION: Release
    PLATFORM: x64
    UptimeWidget_SOLUTION: UptimeWidget/UptimeWidget.slnx
    MAJOR_VERSION: 1
    MINOR_VERSION: 0

jobs:
    build_UptimeWidget:
        runs-on: windows-latest
        outputs:
            is_prerelease: ${{ steps.prerelease.outputs.value }}
        steps:
          - name: Determine is_prerelease
            id: prerelease
            shell: pwsh
            run: |
                $isPrerelease = if ("${{ github.ref }}" -like "refs/heads/release/*") { "false" } else { "true" }
                Write-Output "value=$isPrerelease" >> $env:GITHUB_OUTPUT
                Write-Output "is_prerelease=$isPrerelease"

          - name: Checkout code
            uses: actions/checkout@v7
            with:
                sparse-checkout: |
                    UptimeWidget
                sparse-checkout-cone-mode: true

          - name: dotnet version
            run: dotnet --version

          - name: Resolve version
            id: version
            shell: pwsh
            run: |
                $v = "${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ github.run_number }}.${{ github.run_attempt }}"
                Write-Output "value=$v" >> $env:GITHUB_OUTPUT
                Write-Output "Building version $v"

          - name: Build UptimeWidget
            run: |
                dotnet build "$env:UptimeWidget_SOLUTION" --configuration "$env:CONFIGURATION" -p:Version=${{ steps.version.outputs.value }}

          - name: Verify publish files
            shell: pwsh
            run: |
                Get-ChildItem `
                    UptimeWidget/UptimeWidget/bin/${{ env.PLATFORM }}/${{ env.CONFIGURATION }}/net10.0-windows/ `
                    -Recurse

          - name: Publish artifacts
            uses: actions/upload-artifact@v7
            with:
                name: UptimeWidget-build-artifact
                path: |
                    UptimeWidget/UptimeWidget/bin/${{ env.PLATFORM }}/${{ env.CONFIGURATION }}/net10.0-windows/
                    !UptimeWidget/UptimeWidget/bin/${{ env.PLATFORM }}/${{ env.CONFIGURATION }}/net10.0-windows/**/*.pdb

    build_installer:
        needs: build_UptimeWidget
        if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))) || (github.event_name == 'workflow_dispatch' && inputs.build_installer == true) }}
        uses: ./.github/workflows/installer-build.yml
        with:
            is_prerelease: ${{ needs.build_UptimeWidget.outputs.is_prerelease == 'true' }}

    upload_release:
        needs: [build_UptimeWidget, build_installer]
        if: ${{ success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
        uses: ./.github/workflows/upload-release.yml
        with:
            artifact_name: UptimeWidget-installer-artifact
            is_prerelease: ${{ needs.build_UptimeWidget.outputs.is_prerelease == 'true' }}
