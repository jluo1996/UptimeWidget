name: Build UptimeWidget

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CONFIGURATION: Release
  PLATFORM: x64
  UptimeWidget_SOLUTION: UptimeWidget/UptimeWidget.slnx
  
jobs:
  build_UptimeWidget:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: dotnet version
        run: dotnet --version

      - name: Build UptimeWidget
        run: |
          dotnet build "$env:UptimeWidget_SOLUTION" --configuration "$env:CONFIGURATION"

      - name: Install WiX ClI
        run: dotnet tool install --global WiX
        
      - name: WiX version
        run: wix --version

      - name: Build UptimeWidget Installer
        run: |
          cd UptimeWidgetInstaller
          wix build UptimeWidgetInstaller.wixproj -o ../UptimeWidgetInstaller/bin/Release/UptimeWidgetInstaller.msi