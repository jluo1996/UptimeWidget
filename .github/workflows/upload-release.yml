name: Upload UptimeWidget Release

on:
    workflow_run:
        workflows:
            - Build UptimeWidget Installer
        types:
            - completed
        branches:
            - main

permissions:
    actions: read
    contents: write

env:
    INSTALLER_PATH: UptimeWidget-installer-build
    INSTALLER_FILE: ""
    RELEASE_VERSION: ""
    BASE_NAME: ""
    IS_OFFICIAL_RELEASE: false
    TAG_NAME: ""

jobs:
    upload_release:
        if: >
          ${{
            github.event.workflow_run.conclusion == 'success' &&
            ( 
              github.event.workflow_run.head_branch == 'main' ||
              github.event.workflow_run.head_branch == 'release'
            ) }}
        runs-on: ubuntu-latest

        steps:
            - name: Download build artifact
              uses: actions/download-artifact@v8
              with:
                    name: UptimeWidget-installer-artifact
                    path: ${{ env.INSTALLER_PATH }}
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    run-id: ${{ github.event.workflow_run.id }}
            
            - name: Show artifact files
              shell: bash
              run: |
                    find ${{ env.INSTALLER_PATH }} -type f

            - name: Stage installer file
              shell: bash
              run: |
                    set -euo pipefail

                    installer_file="$(find ${{ env.INSTALLER_PATH }} -type f -name '*.exe' | head -n 1)"
                    if [ -z "$installer_file" ]; then
                      echo "No installer artifact found" >&2
                      exit 1
                    fi

                    echo "INSTALLER_FILE=$installer_file" >> "$GITHUB_ENV"
                    echo "Staged installer file: $INSTALLER_FILE"

            - name: Extract base_name, release_version, and installer_file
              shell: bash
              run: |
                base_name="$(basename "$INSTALLER_FILE")"
                version="$(echo "$base_name" | sed -E 's/.*UptimeWidget-([0-9]+(\.[0-9]+)+).*/\1/')"

                if [ -z "$version" ]; then
                  echo "Could not extract version from installer name: $base_name" >&2
                  exit 1
                fi

                echo "BASE_NAME=$base_name" >> "$GITHUB_ENV"
                echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
                echo "INSTALLER_FILE=$INSTALLER_FILE" >> "$GITHUB_ENV"
                
                echo "Extracted version: $RELEASE_VERSION"
                echo "Base name: $BASE_NAME"
                echo "Installer file: $INSTALLER_FILE"

            - name: Build release name
              run: |
                release_name="$BASE_NAME"

                if [[ "${{ github.ref_name }}" == "release" ]]; then
                  is_official_release=true
                  release_name=${release_name/-nightly/}
                  
                else
                  is_official_release=false
                fi

                echo "RELEASE_NAME=$release_name" >> "$GITHUB_ENV"
                echo "IS_OFFICIAL_RELEASE=$is_official_release" >> "$GITHUB_ENV"

            - name: Build tag name
              run: |
                tag_name="v$RELEASE_VERSION"
                if [[ "$IS_OFFICIAL_RELEASE" == "false" ]]; then
                  tag_name="${tag_name}-nightly"
                fi

                echo "TAG_NAME=$tag_name" >> "$GITHUB_ENV"
                echo "Tag name: $tag_name"

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                    tag_name: ${{ env.TAG_NAME }}
                    generate_release_notes: true
                    name: ${{ env.RELEASE_NAME }}
                    files: ${{ env.INSTALLER_FILE }}
                    prerelease: ${{ env.IS_OFFICIAL_RELEASE == 'false' }}
                    make_latest: ${{ env.IS_OFFICIAL_RELEASE == 'true' }}
              env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                fetch-depth: 0

            - name: Delete all releases
              shell: pwsh
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                $tagPattern = "*"
                $keep_latest = 1

                $releases = gh release list --limit 1000 --json tagName,createdAt | ConvertFrom-Json
                $matchingReleases = $releases | Where-Object { $_.tagName -like $tagPattern } | Sort-Object createdAt -Descending
                $matchingReleasesToDelete = $matchingReleases | Select-Object -Skip $keep_latest

                foreach ($release in $matchingReleasesToDelete) {
                  Write-Host "Deleting release with tag: $($release.tagName)"
                  gh release delete $release.tagName --yes --cleanup-tag
                }
                
                git fetch --tags
                $matchingTags = git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | Where-Object { $_ -like $tagPattern }
                $tagsToDelete = $matchingTags | Select-Object -Skip $keep_latest
                foreach ($tag in $tagsToDelete) {
                  Write-Host "Deleting tag: $tag"
                  git tag -d $tag
                  git push origin ":refs/tags/$tag"
                }
        