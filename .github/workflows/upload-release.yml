name: Upload UptimeWidget Release

on:
    workflow_run:
        workflows:
            - Build UptimeWidget Installer
        types:
            - completed

permissions:
    actions: read
    contents: write

env:
    INSTALLER_PATH: UptimeWidget-installer-build
    INSTALLER_FILE: ""
    RELEASE_VERSION: ""
    BASE_NAME: ""
    RELEASE_NAME: ""
    TAG_NAME: ""
    IS_PRERELEASE: ${{ !startsWith(github.event.workflow_run.head_branch, 'release/') }}

jobs:
    upload_release:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        
        steps:
            - name: Debug GitHub context
              run: |
                echo "github.ref = ${{ github.ref }}"
                echo "github.ref_name = ${{ github.ref_name }}"
                echo "github.event_name = ${{ github.event_name }}"
                echo "github.ref=${{ github.ref }}"
                echo "workflow_run.head_branch=${{ github.event.workflow_run.head_branch }}"
                echo "workflow_run.head_sha=${{ github.event.workflow_run.head_sha }}"

            - name: Download build artifact
              uses: actions/download-artifact@v8
              with:
                    name: UptimeWidget-installer-artifact
                    path: ${{ env.INSTALLER_PATH }}
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    run-id: ${{ github.event.workflow_run.id }}
            
            - name: Show artifact files
              shell: bash
              run: |
                    find ${{ env.INSTALLER_PATH }} -type f

            - name: Stage installer file
              shell: bash
              run: |
                    set -euo pipefail

                    installer_file="$(find ${{ env.INSTALLER_PATH }} -type f -name '*.exe' | head -n 1)"
                    if [ -z "$installer_file" ]; then
                      echo "No installer artifact found" >&2
                      exit 1
                    fi

                    echo "INSTALLER_FILE=$installer_file" >> "$GITHUB_ENV"
                    echo "Staged installer file: $INSTALLER_FILE"

            - name: Extract base_name, release_version, and installer_file
              shell: bash
              run: |
                base_name="$(basename "$INSTALLER_FILE")"
                version="$(echo "$base_name" | sed -E 's/.*UptimeWidget-([0-9]+(\.[0-9]+)+).*/\1/')"

                if [ -z "$version" ]; then
                  echo "Could not extract version from installer name: $base_name" >&2
                  exit 1
                fi

                echo "BASE_NAME=$base_name" >> "$GITHUB_ENV"
                echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
                echo "INSTALLER_FILE=$INSTALLER_FILE" >> "$GITHUB_ENV"
                
                echo "Extracted version: $RELEASE_VERSION"
                echo "Base name: $BASE_NAME"
                echo "Installer file: $INSTALLER_FILE"

            - name: Build release name
              run: |
                release_name="$BASE_NAME"

                if [[ "$IS_PRERELEASE" != "true" ]]; then
                  release_name=${release_name/-nightly/}
                fi

                echo "RELEASE_NAME=$release_name" >> "$GITHUB_ENV"

            - name: Build tag name
              run: |
                tag_name="v$RELEASE_VERSION"
                if [[ "$IS_PRERELEASE" == "true" ]]; then
                  tag_name="${tag_name}-nightly"
                fi

                echo "TAG_NAME=$tag_name" >> "$GITHUB_ENV"
                echo "Tag name: $tag_name"

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                    tag_name: ${{ env.TAG_NAME }}
                    generate_release_notes: true
                    name: ${{ env.RELEASE_NAME }}
                    files: ${{ env.INSTALLER_FILE }}
                    prerelease: ${{ env.IS_PRERELEASE == 'true' }}
                    make_latest: ${{ env.IS_PRERELEASE != 'true' }}
              env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Delete pre-release
              if: ${{ env.IS_PRERELEASE != 'true' }}
              uses: jluo1996/delete-releases-action@v1
              with:
                  tag-pattern: "*-nightly*"
                  keep-latest: 0
                  remove-tags: true
                  repository: ${{ github.repository }}
                  token: ${{ secrets.GITHUB_TOKEN }}

        