name: Upload UptimeWidget Release

on:
    workflow_call:
        inputs:
            artifact_name:
                description: "The name of the artifact to download from the installer build workflow."
                required: true
                type: string
            is_prerelease:
                description: "Whether this build is a pre-release."
                required: true
                type: boolean

permissions:
    actions: read
    contents: write

env:
    INSTALLER_PATH: UptimeWidget-installer-build
    INSTALLER_FILE: ""
    RELEASE_VERSION: ""
    BASE_NAME: ""
    RELEASE_NAME: ""
    TAG_NAME: ""

jobs:
    upload_release:
        runs-on: ubuntu-latest
        
        steps:
            - name: Download build artifact
              uses: actions/download-artifact@v8
              with:
                    name: ${{ inputs.artifact_name }}
                    path: ${{ env.INSTALLER_PATH }}
            
            - name: Show artifact files
              shell: bash
              run: |
                    find ${{ env.INSTALLER_PATH }} -type f

            - name: Stage installer file
              shell: bash
              run: |
                    set -euo pipefail

                    installer_file="$(find ${{ env.INSTALLER_PATH }} -type f -name '*.exe' | head -n 1)"
                    if [ -z "$installer_file" ]; then
                      echo "No installer artifact found" >&2
                      exit 1
                    fi

                    echo "INSTALLER_FILE=$installer_file" >> "$GITHUB_ENV"
                    echo "Staged installer file: $INSTALLER_FILE"

            - name: Extract base_name, release_version, and installer_file
              shell: bash
              run: |
                base_name="$(basename "$INSTALLER_FILE")"
                version="$(echo "$base_name" | sed -E 's/.*UptimeWidget-([0-9]+(\.[0-9]+)+).*/\1/')"

                if [ -z "$version" ]; then
                  echo "Could not extract version from installer name: $base_name" >&2
                  exit 1
                fi

                echo "BASE_NAME=$base_name" >> "$GITHUB_ENV"
                echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
                echo "INSTALLER_FILE=$INSTALLER_FILE" >> "$GITHUB_ENV"
                
                echo "Extracted version: $RELEASE_VERSION"
                echo "Base name: $BASE_NAME"
                echo "Installer file: $INSTALLER_FILE"

            - name: Extract release name and tag name
              run: |
                release_name="${BASE_NAME%-Setup.exe}"

                tag_name="v$RELEASE_VERSION"
                if [[ "$release_name" == *-nightly ]]; then
                  tag_name="${tag_name}-nightly"
                fi

                echo "RELEASE_NAME=$release_name" >> "$GITHUB_ENV"
                echo "TAG_NAME=$tag_name" >> "$GITHUB_ENV"
                echo "Release name: $release_name"
                echo "Tag name: $tag_name"

            - name: Get last non-prerelease release tag
              if: ${{ inputs.is_prerelease != true }}
              id: get_last_release_tag
              uses: actions/github-script@v9
              with:
                script: |
                  const { data } = await github.rest.repos.listReleases({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    per_page: 100
                  });

                  const release = data.find(r => !r.prerelease);

                  core.setOutput('tag', release?.tag_name ?? '');
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Print last non-prerelease release tag
              run: |
                echo "Last non-prerelease release tag: ${{ steps.get_last_release_tag.outputs.tag }}"

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                    tag_name: ${{ env.TAG_NAME }}
                    generate_release_notes: true
                    name: ${{ env.RELEASE_NAME }}
                    files: ${{ env.INSTALLER_FILE }}
                    prerelease: ${{ inputs.is_prerelease == true }}
                    previous_tag: ${{ steps.get_last_release_tag.outputs.tag }}
                    make_latest: ${{ inputs.is_prerelease != true }}
              env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Delete pre-release
              if: ${{ inputs.is_prerelease != true }}
              uses: jluo1996/delete-releases-action@v1
              with:
                  tag-pattern: "*-nightly*"
                  keep-latest: 0
                  remove-tags: true
                  repository: ${{ github.repository }}
                  token: ${{ secrets.GITHUB_TOKEN }}

        